name: Validate agent skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository hooks
        run: ./scripts/install-hooks.sh

      - name: Validate through the pre-commit hook
        run: ./.githooks/pre-commit
